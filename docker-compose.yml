version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: authflow
      POSTGRES_PASSWORD: authflow
      POSTGRES_DB: authflow
    ports:
      - "5432:5432"
    volumes:
      - authflow_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authflow -d authflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:v1.0.1
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI — view sent verification/reset emails here

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://authflow:authflow@postgres:5432/authflow?schema=public
      REDIS_URL: redis://redis:6379
      EMAIL_HOST: mailhog
      EMAIL_PORT: 1025
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started
    ports:
      - "4000:4000"
    command: >
      sh -c "npx prisma migrate deploy --schema apps/api/prisma/schema.prisma &&
             node dist/index.js"

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      args:
        VITE_API_URL: http://localhost:4000
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:80"

  demo-app:
    build:
      context: .
      dockerfile: docker/demo-app/Dockerfile
      args:
        VITE_API_URL: http://localhost:4000
        VITE_AUTHFLOW_URL: http://localhost:5173
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5174:80"

volumes:
  authflow_pg_data:
